---
- name: Import manifest
  ansible.builtin.import_role:
    name:  redhat.satellite.manifest
  vars:
    satellite_server_url: "{{ satellite_url }}"
    satellite_username: "{{ satellite_user }}"
    satellite_password: "{{ satellite_pass }}"
    satellite_organization: "{{ satellite_org }}"
    satellite_manifest_path: "manifest.zip"                   #you would need to provide your manifest file here
    satellite_validate_certs: false
  tags:
    - manifest
