---
# tasks file for satellite-build

- name: Capture this role's path so imported roles can resolve files/ correctly
  ansible.builtin.set_fact:
    satellite_build_role_path: "{{ role_path }}"
  tags:
    - always

- name: Pre-checks
  ansible.builtin.import_tasks:
    file: 01-prechecks.yml

- name: Further checks
  ansible.builtin.import_tasks:
    file: 02-prechecks.yml

- name: Create logical volumes
  ansible.builtin.import_tasks:
    file: 03-create_vg.yml

- name: Add Services to firewall and ports
  ansible.builtin.import_tasks:
    file: 04-firewall_hosts_resolve.yml

- name: Register server to redhat portal
  ansible.builtin.include_tasks:
    file: 05-redhat_subscription.yml
  tags:
    - subscription

- name: Set up satellite server
  ansible.builtin.include_tasks:
    file: 06-satellite-install.yml

- name: configure the satellite server
  ansible.builtin.include_tasks:
    file: 07-configure-satellite.yml
  tags:
    - manifest
    - repos
    - lifecycle
    - content_views
    - promote
    - ak-keys
