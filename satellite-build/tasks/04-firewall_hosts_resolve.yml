---

- name: Open the ports for clients on Satellite Server
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop: "{{ ports }}"

- name: Allow access to services on Satellite Server
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ services }}"
  notify: reload the firewalld daemon

- name: View all firewall zones and allowed services
  ansible.builtin.command: firewall-cmd --list-all
  register: firewalld

- name: Debug firewall zones and allowed services
  ansible.builtin.debug:
    msg: "{{ firewalld.stdout_lines | select('search', '^\\s*services:') | list }}"

- name: Ensure that the host name and local host resolve correctly
  ansible.builtin.ping:
  register: pingout

- name: Debug host name and local host resolve correctly
  ansible.builtin.debug:
    var: pingout

- name: Ensure host resolves again
  ansible.builtin.shell: ping -c1 `hostname -f`
  register: resolves

- name: Debug host resolves
  ansible.builtin.debug:
    var: resolves
